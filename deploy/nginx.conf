# ===========================================
# NGINX LOAD BALANCER CONFIGURATION - PHASE 3
# HRMS Production Load Balancing Setup
# ===========================================

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Maximum file upload size limit (set to 50MB to support large photo and document uploads)
    client_max_body_size 50M;

    # Rate limiting zones
    limit_req_zone $binary_remote_addr zone=api:10m rate=10r/s;
    limit_req_zone $binary_remote_addr zone=auth:10m rate=5r/m;

    # Upstream backend servers (app instances)
    upstream hrms_backend {
        least_conn;  # Least connections algorithm

        # Health check configuration (Nginx Plus only - disabled for open-source Nginx)
        # health_check interval=5s fails=3 passes=2 uri=/api/health;

        # Application instances (managed collectively by PM2 cluster on port 3000)
        server localhost:3000 max_fails=3 fail_timeout=30s;

    # Keep connections alive
    keepalive 32;
}

# HTTP server - Redirect all traffic to HTTPS using the proper domain name
server {
    listen 80;
    server_name absensi.rsumeloy.com _;
    return 301 https://absensi.rsumeloy.com$request_uri;
}

# HTTPS server
server {
    listen 443 ssl;
    server_name absensi.rsumeloy.com _;

    # Force redirect to the correct domain to avoid ERR_CERT_COMMON_NAME_INVALID on IP access
    if ($host != "absensi.rsumeloy.com") {
        return 301 https://absensi.rsumeloy.com$request_uri;
    }

    # SSL configuration
    ssl_certificate /etc/ssl/certs/live/absensi.rsumeloy.com/fullchain.pem;
    ssl_certificate_key /etc/ssl/certs/live/absensi.rsumeloy.com/privkey.pem;

    # SSL security settings
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-RSA-AES128-GCM-SHA256:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    # Document root mapping for Vite static build files
    root /usr/share/nginx/html;
    index index.html;

    # Security headers
    add_header X-Frame-Options DENY;
    add_header X-Content-Type-Options nosniff;
    add_header X-XSS-Protection "1; mode=block";
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin";

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/javascript
        application/xml+rss
        application/json;

    # Service Worker: MUST NEVER be cached - browser must always get the latest version.
    # This exact-match rule takes priority over the *.js wildcard rule below.
    # Without this, sw.js gets cached for 1 year with "immutable", causing browsers
    # to keep running old SW versions with stale JS chunk caches → 404 → ErrorBoundary.
    location = /sw.js {
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
        add_header Service-Worker-Allowed "/";
        add_header X-Content-Type-Options nosniff;
        try_files $uri =404;
    }

    # Static assets caching (JS/CSS get long-term immutable cache because
    # Vite generates content-hashed filenames on every build)
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options nosniff;

        # Try to serve from backend if not found
        try_files $uri @backend;
    }

    # API endpoints with rate limiting
    location ^~ /api/ {
        # Rate limiting for API calls
        limit_req zone=api burst=20 nodelay;

        # CORS headers (handled by backend)
        # add_header Access-Control-Allow-Origin "https://hrms.example.com";
        # add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS";
        # add_header Access-Control-Allow-Headers "Authorization, Content-Type, X-Requested-With";

        # Proxy to backend
        proxy_pass http://hrms_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;

        # Timeout settings
        proxy_connect_timeout 30s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
    }

    # Authentication endpoints with stricter rate limiting
    location /api/auth/ {
        limit_req zone=auth burst=5 nodelay;

        proxy_pass http://hrms_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    # Reverse Proxy for Supabase API Gateway (Kong)
    location ^~ /supabase/ {
        proxy_pass http://127.0.0.1:54321/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Disable buffering for Server-Sent Events (SSE) / Realtime
        proxy_buffering off;
    }

    # Health check endpoint (no rate limiting)
    location /api/health {
        proxy_pass http://hrms_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Quick response for health checks
        proxy_connect_timeout 5s;
        proxy_send_timeout 5s;
        proxy_read_timeout 5s;
    }

    # Administrative Control Panel (Dashboard)
    location /control-panel/ {
        proxy_pass http://127.0.0.1:8080/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # index.html must NEVER be cached - ensures users always get the
    # latest JS/CSS bundles after a deployment (prevents stale-file crashes)
    location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
        try_files $uri =404;
    }

    # Mailpit Email Simulator (Inbucket alternative) with sub_filter rewrites
    location ^~ /mailpit/ {
        proxy_pass http://127.0.0.1:54324/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Disable compression so sub_filter can rewrite HTML/JS text
        proxy_set_header Accept-Encoding "";

        # Rewrite absolute asset/API paths relative to the subpath
        sub_filter_once off;
        sub_filter_types text/css application/javascript application/json;
        sub_filter '"/assets/' '"/mailpit/assets/';
        sub_filter '"/api/v1/' '"/mailpit/api/v1/';
        sub_filter '"/search' '"/mailpit/search';
        sub_filter '"/view/' '"/mailpit/view/';
        sub_filter 'src="/' 'src="/mailpit/';
        sub_filter 'href="/' 'href="/mailpit/';
        sub_filter 'url("/' 'url("/mailpit/';
    }

    # Optimized Direct Streaming for Mobile APK Downloads
    location ^~ /downloads/ {
        alias /usr/share/nginx/html/downloads/;
        sendfile on;
        tcp_nopush on;
        tcp_nodelay on;
        gzip off; # Disabled gzip for already-compressed APK binary
        add_header Cache-Control "public, max-age=3600";
        add_header Content-Disposition "attachment";
    }

    # Main application (SPA fallback)
    location / {
        # Try static files first, then fallback to index.html for SPA client-side routing
        try_files $uri $uri/ /index.html;
        
        # Prevent caching of the index.html served at root
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
    }

    # Backend fallback for SPA routing
    location @backend {
        proxy_pass http://hrms_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;

        # SPA fallback for client-side routing
        proxy_intercept_errors on;
        error_page 404 = @spa_fallback;
    }

    # SPA fallback for client-side routing
    location @spa_fallback {
        proxy_pass http://hrms_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Monitoring endpoints (protected)
    location /metrics {
        # Allow only local access or specific IPs
        allow 127.0.0.1;
        allow ::1;
        deny all;

        proxy_pass http://localhost:9090;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    # Error pages
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}

# Monitoring server (separate port for internal access)
server {
    listen 9091;
    server_name localhost;

    location / {
        proxy_pass http://localhost:9090;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
}