<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06736a"/>
      <stop offset="50%" stop-color="#089c8e"/>
      <stop offset="100%" stop-color="#0d5c55"/>
    </linearGradient>
    <linearGradient id="crossGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#e6f7f5"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.25"/>
    </filter>
  </defs>
  
  <!-- Rounded Shield / Badge Background -->
  <rect x="32" y="32" width="448" height="448" rx="112" fill="url(#bgGrad)" filter="url(#shadow)"/>
  
  <!-- Outer Glow Ring -->
  <rect x="48" y="48" width="416" height="416" rx="96" fill="none" stroke="#ffffff" stroke-opacity="0.2" stroke-width="8"/>
  
  <!-- Medical Cross Symbol -->
  <g filter="url(#shadow)">
    <!-- Vertical Bar -->
    <rect x="216" y="128" width="80" height="256" rx="24" fill="url(#crossGrad)"/>
    <!-- Horizontal Bar -->
    <rect x="128" y="216" width="256" height="80" rx="24" fill="url(#crossGrad)"/>
  </g>
  
  <!-- Heartbeat / ECG Accent Line -->
  <path d="M 140 256 H 200 L 224 208 L 248 296 L 272 232 L 288 256 H 372" 
        fill="none" 
        stroke="#06736a" 
        stroke-width="16" 
        stroke-linecap="round" 
        stroke-linejoin="round"/>
</svg>
